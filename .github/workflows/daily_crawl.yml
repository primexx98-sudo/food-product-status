name: 품목신고보고현황 일일 수집

on:
  schedule:
    - cron: '0 1 * * *'  # 매일 01:00 UTC = 10:00 KST
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 데이터 수집 및 엑셀 생성
        env:
          FOOD_API_KEY: ${{ secrets.FOOD_API_KEY }}
        run: python src/main.py

      - name: 결과 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/
          git diff --staged --quiet || git commit -m "Auto: $(date +'%Y-%m-%d') 품목신고보고현황 업데이트"
          git push
