name: 품목신고보고현황 일일 수집

on:
  schedule:
    - cron: '0 11 * * *'  # 매일 11:00 UTC = 20:00 KST (09~19시 KST API 제한 운영 시간 회피)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: API 접근 가능 여부 진단
        run: |
          echo "=== 식품안전나라 API 연결 진단 ==="
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 15 \
            "https://openapi.foodsafetykorea.go.kr/" 2>/dev/null || echo "000")
          echo "HTTP 상태코드: $HTTP"
          if   [ "$HTTP" = "000" ]; then echo "[진단] 연결 실패 — DNS 오류 또는 방화벽 차단"
          elif [ "$HTTP" = "403" ]; then echo "[진단] HTTP 403 — 해외 IP 차단 확인됨"
          elif [ "$HTTP" = "200" ] || [ "$HTTP" = "301" ] || [ "$HTTP" = "302" ]; then
            echo "[진단] HTTP $HTTP — 접근 가능"
          else
            echo "[진단] HTTP $HTTP — 예상 외 상태"
          fi

      - name: 데이터 수집 및 엑셀 생성
        env:
          FOOD_API_KEY: ${{ secrets.FOOD_API_KEY }}
        run: python src/main.py

      - name: 랭킹 대시보드 데이터 생성
        run: python src/report_builder.py

      - name: 결과 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output/ docs/data/
          git diff --staged --quiet || git commit -m "Auto: $(date +'%Y-%m-%d') 품목신고보고현황 업데이트"
          git push
