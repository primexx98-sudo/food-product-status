<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>품목신고보고랭킹</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #0f1216; color: #e9ecef; font-family: 'Malgun Gothic', sans-serif; min-height: 100vh; }
  .hero { padding: 40px 24px 24px; text-align: center; }
  .hero h1 { margin: 0 0 8px; font-size: 1.7rem; }
  .hero p { margin: 0; color: #adb5bd; font-size: 0.9rem; }

  .controls { max-width: 1200px; margin: 0 auto; padding: 0 24px 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }
  .controls select {
    background: #171b21; color: #e9ecef; border: 1px solid #262b33; border-radius: 8px;
    padding: 8px 12px; font-size: 0.88rem; font-family: inherit; cursor: pointer;
  }
  .kind-toggle { display: flex; gap: 6px; background: #171b21; border: 1px solid #262b33; border-radius: 10px; padding: 4px; }
  .kind-toggle button {
    background: transparent; border: none; color: #909aa4; padding: 8px 16px; border-radius: 8px;
    font-size: 0.88rem; font-family: inherit; cursor: pointer; transition: background .15s, color .15s;
  }
  .kind-toggle button.active { background: #52b788; color: #0b0e11; font-weight: 700; }

  .totals { text-align: center; color: #909aa4; font-size: 0.82rem; padding-bottom: 20px; }
  .totals b { color: #e9ecef; }

  .cards { max-width: 1200px; margin: 0 auto; padding: 0 24px 20px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
  @media (max-width: 1000px) { .cards { grid-template-columns: 1fr; } }

  .cards-row2 { max-width: 1200px; margin: 0 auto; padding: 0 24px 48px; display: grid; grid-template-columns: 1fr; gap: 20px; }

  .card { background: #171b21; border: 1px solid #262b33; border-radius: 16px; padding: 22px; }
  .card-header { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 1rem; margin-bottom: 4px; }
  .card-note { color: #565d66; font-size: 0.72rem; margin-bottom: 14px; line-height: 1.4; }

  table { width: 100%; border-collapse: collapse; }
  td { padding: 5px 0; font-size: 0.86rem; vertical-align: middle; }
  td.rank { width: 26px; padding-right: 6px; color: #909aa4; font-size: 0.82rem; text-align: right; }
  td.name { padding-right: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  td.bar-cell { width: 46%; }
  .bar { height: 18px; border-radius: 4px; min-width: 30px; white-space: nowrap;
         color: #0b0e11; font-size: 11px; font-weight: 700; padding: 1px 6px;
         font-family: 'JetBrains Mono', monospace; box-sizing: border-box; display: flex; align-items: center; }

  td.delta { width: 46px; padding-right: 2px; font-size: 0.74rem; font-weight: 700; text-align: right; white-space: nowrap; }
  .delta-up { color: #52b788; }
  .delta-down { color: #e5484d; }
  .delta-flat { color: #565d66; }
  .delta-new { color: #fcd535; font-size: 0.68rem; font-weight: 700; border: 1px solid #fcd535; border-radius: 4px; padding: 1px 4px; }

  .trend-card .empty { padding: 12px 0; }
  .trend-list { display: flex; flex-direction: column; gap: 10px; }
  .trend-item { display: flex; align-items: center; gap: 10px; font-size: 0.86rem; }
  .trend-item .t-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trend-item .t-count { color: #909aa4; font-size: 0.78rem; width: 54px; text-align: right; }
  .trend-item .t-delta { width: 70px; text-align: right; font-weight: 700; font-size: 0.8rem; }

  .empty { color: #565d66; font-size: 0.85rem; text-align: center; padding: 20px 0; }

  tr[data-drill] { cursor: pointer; }
  tr[data-drill]:hover .name { color: #fcd535; }

  .skel-bar { height: 18px; border-radius: 4px; background: linear-gradient(90deg, #1c2129 25%, #262b33 37%, #1c2129 63%);
              background-size: 400% 100%; animation: skel-pulse 1.4s ease infinite; }
  @keyframes skel-pulse { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  .modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50;
                     align-items: center; justify-content: center; padding: 20px; }
  .modal-backdrop.open { display: flex; }
  .modal { background: #171b21; border: 1px solid #262b33; border-radius: 16px; max-width: 560px; width: 100%;
           max-height: 80vh; display: flex; flex-direction: column; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 18px 20px 10px; }
  .modal-header h3 { margin: 0; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .modal-close { background: none; border: none; color: #909aa4; font-size: 1.4rem; cursor: pointer; line-height: 1; padding: 4px 6px; flex: none; }
  .modal-search { margin: 0 20px 10px; }
  .modal-search input { width: 100%; background: #0f1216; border: 1px solid #262b33; border-radius: 8px;
                         padding: 9px 12px; color: #e9ecef; font-family: inherit; font-size: 0.85rem; box-sizing: border-box; }
  .modal-list { overflow-y: auto; padding: 0 20px 20px; flex: 1; }
  .modal-item { padding: 8px 0; border-bottom: 1px solid #1c2129; font-size: 0.85rem; }
  .modal-item .m-name { display: block; }
  .modal-item .m-company { display: block; color: #707a8a; font-size: 0.75rem; margin-top: 2px; }
  .modal-empty { color: #565d66; text-align: center; padding: 30px 0; font-size: 0.85rem; }

  footer { text-align: center; color: #565d66; font-size: 0.78rem; padding: 24px; }
  footer .credit { display: block; margin-top: 4px; font-size: 0.7rem; color: #3d4249; }

  @media (max-width: 480px) {
    .hero { padding: 28px 16px 16px; }
    .hero h1 { font-size: 1.32rem; }
    .hero p { font-size: 0.78rem; }
    .controls { padding: 0 16px 8px; gap: 8px; flex-direction: column; align-items: stretch; }
    .controls select { width: 100%; }
    .kind-toggle { justify-content: stretch; }
    .kind-toggle button { flex: 1; padding: 8px 6px; font-size: 0.82rem; white-space: nowrap; }
    .totals { font-size: 0.76rem; }
    .cards { padding: 0 16px 16px; gap: 14px; }
    .cards-row2 { padding: 0 16px 32px; }
    .card { padding: 16px; }
    .card-header { font-size: 0.92rem; }
    td { font-size: 0.8rem; }
    td.name { max-width: 96px; padding-right: 6px; }
    td.bar-cell { width: 36%; }
    .bar { font-size: 10px; padding: 1px 4px; }
    td.delta { width: 36px; font-size: 0.68rem; }
    .trend-item { font-size: 0.8rem; }
    .trend-item .t-count { width: 44px; }
    .trend-item .t-delta { width: 54px; }
    .modal-backdrop { padding: 0; align-items: flex-end; }
    .modal { max-height: 86vh; border-radius: 16px 16px 0 0; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1>📦 품목신고보고랭킹</h1>
  <p>식품안전나라 품목제조신고(건강기능식품)·품목제조보고(일반식품) 데이터로 보는 업소·카테고리·원료 순위</p>
</div>

<div class="controls">
  <select id="month-select"></select>
  <div class="kind-toggle">
    <button id="btn-health" class="active">🏷 건강기능식품</button>
    <button id="btn-general">🥗 일반식품</button>
  </div>
</div>
<div class="totals" id="totals"></div>

<div class="cards" id="cards"></div>
<div class="cards-row2" id="cards-row2"></div>

<footer>
  매일 20:00 (KST) 자동 수집 · food-product-status
  <span class="credit">이우찬</span>
</footer>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title"></h3>
      <button class="modal-close" id="modal-close" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-search"><input type="text" id="modal-search-input" placeholder="품목명·업소명 검색"></div>
    <div class="modal-list" id="modal-list"></div>
  </div>
</div>

<script>
const RANK_COLORS = ['#fcd535', '#f0b90b', '#eaecef', '#929aa5', '#707a8a'];

function rankColor(i) {
  return RANK_COLORS[Math.min(i, RANK_COLORS.length - 1)];
}

function escAttr(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// 순위 변동 배지: 상승은 초록 ▲n, 하락은 빨강 ▼n, 신규는 노란 NEW, 변동없음/비교불가는 빈칸
function deltaBadge(name, deltaMap, newList) {
  if (newList && newList.includes(name)) return '<span class="delta-new">NEW</span>';
  if (!deltaMap || !(name in deltaMap)) return '';
  const d = deltaMap[name];
  if (d > 0) return `<span class="delta-up">▲${d}</span>`;
  if (d < 0) return `<span class="delta-down">▼${-d}</span>`;
  return '<span class="delta-flat">-</span>';
}

function renderBarTable(rows, limit, opts) {
  opts = opts || {};
  if (!rows || rows.length === 0) {
    return '<div class="empty">데이터 없음</div>';
  }
  const items = rows.slice(0, limit);
  const max = items[0][1] || 1;
  const trs = items.map(([name, count], i) => {
    const pct = Math.max((count / max) * 100, 8);
    const deltaCol = opts.deltaMap || opts.newList
      ? `<td class="delta">${deltaBadge(name, opts.deltaMap, opts.newList)}</td>` : '';
    const drillAttr = opts.drill ? ` data-drill="${opts.drill}" data-name="${escAttr(name)}"` : '';
    return `<tr${drillAttr}>
      <td class="rank">${i + 1}</td>
      <td class="name" title="${escAttr(name)}">${name}</td>
      <td class="bar-cell"><div class="bar" style="width:${pct}%;background:${rankColor(i)}">${count}</div></td>
      ${deltaCol}
    </tr>`;
  }).join('');
  return `<table><tbody>${trs}</tbody></table>`;
}

function renderTrending(rows) {
  if (!rows || rows.length === 0) {
    return '<div class="empty">전월 대비 급상승 원재료가 없습니다 (또는 첫 달이라 비교 불가)</div>';
  }
  const items = rows.map(r => {
    const deltaTxt = r.is_new
      ? '<span class="delta-new">NEW</span>'
      : `<span class="delta-up">▲${r.count_delta}</span>`;
    return `<div class="trend-item">
      <span class="t-name" title="${r.name}">${r.name}</span>
      <span class="t-count">${r.count}건</span>
      <span class="t-delta">${deltaTxt}</span>
    </div>`;
  }).join('');
  return `<div class="trend-list">${items}</div>`;
}

function renderCards(data, kind) {
  const cardsEl = document.getElementById('cards');
  cardsEl.innerHTML = `
    <div class="card">
      <div class="card-header">🏭 지정 제조사별 신고건수</div>
      <div class="card-note">동일 계열 공장(예: OO(주) 세종3공장/음성공장)은 한 회사로 합산 · 클릭하면 신고 품목 목록을 볼 수 있습니다</div>
      ${renderBarTable(data.company_watchlist, 20, { drill: 'company' })}
    </div>
    <div class="card">
      <div class="card-header">🗂 카테고리별 신고건수</div>
      <div class="card-note">기능성/용도 키워드 기반 자동 분류 카테고리 순위 · 우측은 전월 대비 순위 변동 · 클릭하면 해당 품목 목록을 볼 수 있습니다. "기타"는 자동분류 키워드에 걸리지 않은 품목으로, 계속 정교화 중입니다</div>
      ${renderBarTable(data.category, 15, { deltaMap: data.category_delta, newList: data.category_new, drill: 'category' })}
    </div>
    <div class="card">
      <div class="card-header">🧪 원재료·기능성 성분별 TOP10</div>
      <div class="card-note">${kind === 'health'
        ? '주된기능성 표시사항에 태깅된 기능성 원료 기준'
        : '원재료명 기준, 정제수·부형제·감미료 등 범용 성분은 제외'} · 전월 대비 순위 변동 · 클릭하면 해당 품목 목록을 볼 수 있습니다</div>
      ${renderBarTable(data.ingredient, 10, { deltaMap: data.ingredient_delta, newList: data.ingredient_new, drill: 'ingredient' })}
    </div>
  `;

  const row2El = document.getElementById('cards-row2');
  row2El.innerHTML = `
    <div class="card trend-card">
      <div class="card-header">🔥 급상승 원재료 (전월 대비)</div>
      <div class="card-note">신규 등장(NEW) 또는 건수가 늘어난 원재료만, 최소 ${window.__TRENDING_MIN_COUNT || 3}건 이상 · "전체 누적" 선택 시에는 비교 대상이 없어 표시되지 않습니다</div>
      ${renderTrending(data.ingredient_trending)}
    </div>
  `;
}

function renderTotals(payload) {
  const h = payload.health.total, g = payload.general.total;
  document.getElementById('totals').innerHTML =
    `건강기능식품 <b>${h.toLocaleString()}</b>건 · 일반식품 <b>${g.toLocaleString()}</b>건`;
}

function renderSkeleton() {
  const skelCard = (title, note) => `<div class="card">
    <div class="card-header">${title}</div>
    <div class="card-note">${note}</div>
    <table><tbody>${Array.from({ length: 6 }).map(() =>
      '<tr><td colspan="3" style="padding:4px 0"><div class="skel-bar"></div></td></tr>').join('')}</tbody></table>
  </div>`;
  document.getElementById('cards').innerHTML =
    skelCard('🏭 지정 제조사별 신고건수', ' ') +
    skelCard('🗂 카테고리별 신고건수', ' ') +
    skelCard('🧪 원재료·기능성 성분별 TOP10', ' ');
  document.getElementById('cards-row2').innerHTML = skelCard('🔥 급상승 원재료 (전월 대비)', ' ');
  document.getElementById('totals').textContent = '불러오는 중…';
}

let currentPayload = null;

function applyKind(kind) {
  window.__currentKind = kind;
  document.getElementById('btn-health').classList.toggle('active', kind === 'health');
  document.getElementById('btn-general').classList.toggle('active', kind === 'general');
  if (currentPayload) renderCards(currentPayload[kind], kind);
}

async function loadMonth(month) {
  renderSkeleton();
  const res = await fetch(`data/${month}.json`);
  currentPayload = await res.json();
  renderTotals(currentPayload);
  applyKind(window.__currentKind || 'health');
}

// ---- 드릴다운 모달 (카드 행 클릭 시 실제 품목 리스트) ----
// items 파일은 카운트 파일과 달리 용량이 커서(누적 기준 최대 ~2MB) 모달을 처음 열 때만
// 지연 로딩하고, 같은 월 선택값으로는 캐시를 재사용한다.
const itemsCache = {};

async function fetchItems(monthValue) {
  if (itemsCache[monthValue]) return itemsCache[monthValue];
  const res = await fetch(`data/${monthValue}_items.json`);
  const data = await res.json();
  itemsCache[monthValue] = data;
  return data;
}

let modalItems = [];

function paintModalList(list) {
  const el = document.getElementById('modal-list');
  if (!list.length) {
    el.innerHTML = '<div class="modal-empty">해당하는 품목이 없습니다</div>';
    return;
  }
  el.innerHTML = list.map(([name, extra]) => `
    <div class="modal-item">
      <span class="m-name">${name || '(품목명 미상)'}</span>
      <span class="m-company">${extra || ''}</span>
    </div>`).join('');
}

function openModal(title) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-search-input').value = '';
  document.getElementById('modal-list').innerHTML = '<div class="modal-empty">불러오는 중…</div>';
  document.getElementById('modal-backdrop').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
}

async function openDrill(drillType, name) {
  openModal(name);
  const monthValue = document.getElementById('month-select').value;
  let list = [];
  try {
    const itemsAll = await fetchItems(monthValue);
    const kindBlock = (itemsAll && itemsAll[window.__currentKind]) || {};
    const map = drillType === 'category' ? kindBlock.category_items
      : drillType === 'ingredient' ? kindBlock.ingredient_items
      : kindBlock.company_watchlist_items;
    list = (map && map[name]) || [];
  } catch (e) {
    document.getElementById('modal-list').innerHTML = '<div class="modal-empty">품목 목록을 불러오지 못했습니다</div>';
    return;
  }
  modalItems = list;
  document.getElementById('modal-title').textContent = `${name} (${list.length}건)`;
  paintModalList(list);
}

async function init() {
  const months = await (await fetch('data/months.json')).json();

  const select = document.getElementById('month-select');
  const opt = document.createElement('option');
  opt.value = 'cumulative';
  opt.textContent = '전체 누적';
  select.appendChild(opt);
  months.slice().reverse().forEach(m => {
    const o = document.createElement('option');
    o.value = m;
    o.textContent = `${m} 신고분`;
    select.appendChild(o);
  });
  select.value = 'cumulative';
  select.addEventListener('change', () => loadMonth(select.value));

  document.getElementById('btn-health').addEventListener('click', () => applyKind('health'));
  document.getElementById('btn-general').addEventListener('click', () => applyKind('general'));

  document.getElementById('cards').addEventListener('click', (e) => {
    const tr = e.target.closest('tr[data-drill]');
    if (tr) openDrill(tr.dataset.drill, tr.dataset.name);
  });
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-backdrop').addEventListener('click', (e) => {
    if (e.target.id === 'modal-backdrop') closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });
  document.getElementById('modal-search-input').addEventListener('input', (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = !q ? modalItems : modalItems.filter(([n, c]) =>
      (n || '').toLowerCase().includes(q) || (c || '').toLowerCase().includes(q));
    paintModalList(filtered);
  });

  window.__currentKind = 'health';
  loadMonth('cumulative');
}

init();
</script>
</body>
</html>
